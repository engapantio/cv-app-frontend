mutation AddCvProject($project: AddCvProjectInput!) {
  addCvProject(project: $project) {
    id
    created_at
    name
    education
    description
    user {
      id
      email
    }
    projects {
      id
      name
      internal_name
      description
      domain
      start_date
      end_date
      environment
      roles
      responsibilities
      project {
        id
        name
        internal_name
      }
    }
    skills {
      name
      mastery
      categoryId
    }
    languages {
      __typename
    }
  }
}
